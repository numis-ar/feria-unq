<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="../ux-error-catalog.js"></script>
<script src="../ux-metrics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<script src="./qr-code.js"></script>
<script src="./image-slot.js"></script>
</helmet>
<div data-banner-paso="" style="display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:44px;padding:30px 0;border-top:2px solid rgba(207,227,216,.35);font-family:'Archivo',Arial,sans-serif;color:#fbfbf8">
<div style="height:230px;display:flex;gap:28px;align-items:center;min-width:0;overflow:hidden">
<div style="flex:none;width:96px;font-size:104px;font-weight:900;line-height:.8;letter-spacing:-.05em;color:#dc5a1e">{{ numero }}</div>
<div style="display:flex;flex-direction:column;gap:14px;min-width:0">
<h2 style="margin:0;font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;text-wrap:balance">{{ titulo }}</h2>
<p style="margin:0;font-size:29px;line-height:1.3;color:#cfe3d8;text-wrap:pretty">{{ texto }}</p>
</div>
</div>
<sc-if value="{{ conQr }}" hint-placeholder-val="{{ true }}">
<div style="width:230px;height:230px;box-sizing:border-box;padding:6px;background:#fbfbf8;border-radius:4px">
<qr-code url="{{ qr }}" style="display:block;width:100%;height:100%"></qr-code>
</div>
</sc-if>
<sc-if value="{{ conImagen }}" hint-placeholder-val="{{ false }}">
<image-slot id="{{ imagenId }}" placeholder="Captura o imagen" shape="rounded" radius="4" style="width:230px;height:230px"></image-slot>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:300},&quot;numero&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Instale la billetera&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;texto&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Descargue GNU Taler Wallet gratis.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;qr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wallet.taler.net/&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imagenId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const qr = this.props.qr || '';
    return {
      conQr: !!qr,
      conImagen: !qr,
      imagenId: this.props.imagenId || ('paso-' + (this.props.numero || 'x'))
    };
  }
}
</script>
</body>
</html>
